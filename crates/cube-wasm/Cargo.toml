[package]
name = "cube-wasm"
version = "0.1.0"
description = "WebAssembly bindings exposing the cube-core engine to the browser"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `cdylib` produces the .wasm module; `rlib` keeps it linkable for tooling.
crate-type = ["cdylib", "rlib"]

[dependencies]
cube-core = { path = "../cube-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-pack invokes wasm-opt; leave it off so a build needs no extra binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
